user nginx;
worker_processes auto;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;

    # HTTP → HTTPS
    server {
        listen 8080;
        server_name adubosrealdigital.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
	listen 8080 default_server;
	server_name _;

	location / {
		return 444;
	}
    }

    # HTTPS
	
    server {
	listen 8443 default_server;
	server_name _;

	ssl_certificate /etc/letsencrypt/live/adubosrealdigital.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/adubosrealdigital.duckdns.org/privkey.pem;
	
	location / {
		return 444;
	}
    }

    server {
        listen 8443 ssl;
        server_name adubosrealdigital.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/adubosrealdigital.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/adubosrealdigital.duckdns.org/privkey.pem;

        # Frontend
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Backend
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

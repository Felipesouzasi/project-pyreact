worker_processes auto;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;

    # ✅ Docker DNS resolver (fixes "host not found")
    resolver 127.0.0.11 valid=30s;

    # ─────────────────────────────
    # HTTP → HTTPS redirect
    # ─────────────────────────────
    server {
	location /nginx_status {
	    stub_status;
	    allow all;
	}


	listen 8080;
        server_name adubosrealdigital.duckdns.org grafanarealdigital.duckdns.org prometheusrealdigital.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────
    # MAIN APP (FastAPI + frontend)
    # ─────────────────────────────
    server {
        listen 8443 ssl default_server;
        server_name adubosrealdigital.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/adubosrealdigital.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/adubosrealdigital.duckdns.org/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ─────────────────────────────
    # GRAFANA
    # ─────────────────────────────
    server {
        listen 8443 ssl;
        server_name grafanarealdigital.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/adubosrealdigital.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/adubosrealdigital.duckdns.org/privkey.pem;

        location / {
            set $grafana grafana:3000;
            proxy_pass http://$grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ─────────────────────────────
    # PROMETHEUS
    # ─────────────────────────────
    server {
    	listen 8443 ssl;
    	server_name prometheusrealdigital.duckdns.org;

    	ssl_certificate /etc/letsencrypt/live/adubosrealdigital.duckdns.org/fullchain.pem;
    	ssl_certificate_key /etc/letsencrypt/live/adubosrealdigital.duckdns.org/privkey.pem;

    	location / {
        	proxy_pass http://prometheus:9090/;

		proxy_set_header Host prometheus:9090;

        	proxy_set_header X-Real-IP $remote_addr;

        # ✅ critical (fix redirect loop)
        	proxy_set_header X-Forwarded-Host $host;
        	proxy_set_header X-Forwarded-Proto https;
        	proxy_set_header X-Forwarded-Port 443;
    }
}
    # ─────────────────────────────
    # BLOCK UNKNOWN HOSTS
    # ─────────────────────────────
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/adubosrealdigital.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/adubosrealdigital.duckdns.org/privkey.pem;

        return 444;
    }
}

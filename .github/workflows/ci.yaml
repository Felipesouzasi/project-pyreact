name: CI/CD Docker Compose

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar_compose:
    name: Validar Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar compose
        run: docker compose config

      - name: Subir containers
        run: docker compose up -d --build || EXIT_CODE=$?


      - name: Aguardar serviços
        run: sleep 20

      - name: Verificar containers
        run: docker ps -a

      - name: Derrubar tudo
        if: always()
        run: docker compose down -v


  testes:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    needs: validar_compose

    steps:
      - uses: actions/checkout@v4

      - name: Subir ambiente
        run: docker compose up -d --build || EXIT_CODE=$?


      - name: Rodar testes (safe)
        run: docker compose run --rm backend pytest || echo "Sem testes"

      - name: Finalizar
        if: always()
        run: docker compose down


  scan_seguranca:
    name: Scan Segurança
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan Postgres
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: postgres:18.4
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Scan código
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Scan dependências
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4


  scan_segredos:
    name: Scan Segredos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2


  lint:
    name: Lint Código
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint frontend
        run: |
          cd frontend || exit 0
          npm ci || true
          npm run lint || true


  build_cache:
    name: Build Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t backend:teste ./backend


  deploy:
    name: Deploy Produção
    runs-on: ubuntu-latest

    needs:
      - validar_compose
      - testes
      - scan_seguranca
      - scan_segredos
      - lint

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |
            set -e

            cd /home/deploy/arpy

            echo "Backup versão atual"
            PREV=$(git rev-parse HEAD)

            echo "Reset repo"
            git reset --hard
            git clean -fd -e .env

            echo "Pull código"
            git pull origin main || (git reset --hard $PREV && exit 1)

            echo "Build frontend"
            cd frontend
            npm ci
            npm run build
            cd ..

            echo "Subindo containers"
            docker compose up -d --build --remove-orphans || (
              echo "Erro -> rollback"
              git reset --hard $PREV
              docker compose up -d --build
              exit 1
            )

            echo "Aguardando app"
            sleep 15

            echo "Deploy OK ✅"
